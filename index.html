<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpendSmart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>SpendSmart - Expense Tracker</h1>
  <div>
    <label>Monthly Budget (₹): </label>
    <input type="number" id="budgetInput">
    <button id="setBudgetBtn">Set Budget</button>
    <p id="budgetInfo"></p>
  </div>
  <div>
    <h2>Add Expense</h2>
    <input type="text" id="name" placeholder="Expense Name">
    <input type="number" id="amount" placeholder="Amount (₹)">
    <select id="category">
      <option>Food</option>
      <option>Travel</option>
      <option>Shopping</option>
      <option>Other</option>
    </select>
    <input type="date" id="date">
    <button id="addBtn">Add</button>
  </div>
  <div>
    <h2>Dashboard</h2>
    <p id="spending"></p>
    <p id="count"></p>
    <p id="remaining"></p>
  </div>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Amount</th>
        <th>Category</th>
        <th>Date</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="expenseTable"></tbody>
  </table>
  <button id="exportBtn">Export JSON</button>
  <input type="file" id="importFile">
  <button id="clearBtn">Clear All</button>

  <script type="module" src="script.js"></script>
</body>
</html>
